name: Daily NSE Fetcher

on:
  schedule:
    - cron: '0 13 * * 1-5' # Runs Monday through Friday
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Git LFS
      run: |
        git lfs install

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Run Fetcher Script
      run: python fetch_data.py
      env:
        START_DATE: '2023-12-01'

    - name: Commit and Push Updated Database
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git lfs track "*.db"
        git add .gitattributes nse_eod_data.db
        git commit -m "Automated update: NSE Bhavcopy EOD Data" || exit 0
        git pull --rebase origin main
        git push origin main