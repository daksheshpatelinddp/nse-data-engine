<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AmiBroker Web Workstation</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d0f14">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-main: #0e1118;
            --bg-panel: #161a25;
            --bg-input: #232736;
            --border: #31364a;
            --border-soft: #232736;
            --text-main: #d1d4dc;
            --text-bright: #e0e3eb;
            --accent: #2962ff;
        }
        body.theme-light {
            --bg-main: #f4f5f7;
            --bg-panel: #ffffff;
            --bg-input: #eef0f4;
            --border: #d3d7e0;
            --border-soft: #e2e5ec;
            --text-main: #1a1d26;
            --text-bright: #0d0f14;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Navigation Bar */
        header { background: var(--bg-panel); border-bottom: 1px solid var(--border-soft); padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .logo { font-weight: bold; color: var(--accent); font-size: 1.1rem; margin-right: 6px; }
        select, button { background: var(--bg-input); color: var(--text-bright); border: 1px solid var(--border); border-radius: 4px; padding: 5px 10px; font-size: 0.82rem; cursor: pointer; outline: none; }

        select:focus, button:focus { border-color: var(--accent); }
        button:hover { background: #2c3244; }
        .btn-active { background: var(--accent) !important; color: white; border-color: var(--accent); }
        
        /* Tab Navigation Bar */
        .tabs-bar { background: var(--bg-panel); display: flex; align-items: center; border-bottom: 1px solid var(--border-soft); overflow-x: auto; white-space: nowrap; }
        .tab { padding: 7px 14px; background: var(--bg-input); border-right: 1px solid var(--border-soft); color: #787b86; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; user-select: none; }
        .tab.active { background: var(--bg-main); color: var(--accent); border-top: 2px solid var(--accent); font-weight: 600; }
        .tab .close-tab { border-radius: 50%; width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; }
        .tab .close-tab:hover { background: #2c3244; color: white; }
        .add-tab-btn { padding: 4px 10px; background: transparent; border: none; color: var(--accent); font-size: 1.2rem; cursor: pointer; }
        
        /* Main Workspace Container */
        #workspace { flex: 1; position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
        .tab-content { display: none; flex: 1; flex-direction: column; width: 100%; height: 100%; position: relative; }
        .tab-content.active { display: flex; }
        
        /* AmiBroker Dual Pane Layout */
        .pane-upper { flex: 7; position: relative; width: 100%; border-bottom: 2px solid var(--border-soft); }
        .pane-lower { flex: 3; position: relative; width: 100%; }
        
        /* Pane Controls Overlay */
        .pane-controls { position: absolute; top: 8px; left: 8px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; background: var(--bg-panel); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-soft); opacity: 0.95; }

        /* Drawing tools (Phase 3, Group B) */
        .btn-draw.tool-active { background: #ff9800 !important; color: #1a1200; border-color: #ff9800; }
        .drawing-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        .drawing-overlay .draw-line { stroke: #ff9800; stroke-width: 2; pointer-events: stroke; cursor: pointer; }
        .drawing-overlay .draw-line-hit { stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
        .drawing-overlay .draw-line.selected { stroke: #ffeb3b; stroke-width: 3; }
        .drawing-overlay .draw-delete-btn { pointer-events: auto; cursor: pointer; }
        .drawing-overlay .draw-delete-btn circle { fill: #ef5350; }
        .drawing-overlay .draw-delete-btn text { fill: white; font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
        
        .status-badge { margin-left: auto; font-size: 0.75rem; padding: 3px 8px; border-radius: 3px; font-weight: 600; }
        .status-online { background: rgba(38, 166, 154, 0.2); color: #26a69a; }
        .status-error { background: rgba(239, 83, 80, 0.2); color: #ef5350; }
        /* Crosshair OHLC legend - follows the pointer like AmiBroker/TradingView */
        .ohlc-legend { position: absolute; top: 8px; right: 12px; z-index: 10; font-size: 0.72rem; font-family: monospace; background: rgba(22, 26, 37, 0.85); padding: 4px 10px; border-radius: 4px; border: 1px solid #232736; color: #d1d4dc; display: none; white-space: nowrap; }
        .ohlc-legend .up { color: #26a69a; }
        .ohlc-legend .down { color: #ef5350; }
    </style>
</head>
<body>

    <header>
        <div class="logo">AmiBroker</div>
        <select id="symbolSelect"><option value="">Initializing DuckDB...</option></select>
        <button id="loadBtn">Load Symbol</button>
        <button id="settingsBtn" title="Settings" style="font-size:1rem; padding:5px 9px;">&#9881;</button>
        <div id="statusBadge" class="status-badge status-online">Connecting R2...</div>
    </header>
    <div id="errorDetail" style="display:none; background:#3a1a1a; color:#ff8a80; font-family:monospace; font-size:0.75rem; padding:8px 12px; white-space:pre-wrap; word-break:break-word; border-bottom:1px solid #5a2a2a;"></div>

    <!-- Settings panel: slides in as a full overlay, closed by default -->
    <div id="settingsOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100;">
        <div id="settingsPanel" style="position:absolute; top:0; right:0; bottom:0; width:min(340px, 92vw); background:var(--bg-panel); border-left:1px solid var(--border); padding:16px; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 style="font-size:1.05rem;">Settings</h2>
                <button id="closeSettingsBtn" style="padding:4px 10px;">&times;</button>
            </div>

            <div style="margin-bottom:18px;">
                <label style="display:block; font-size:0.78rem; color:#868a9c; margin-bottom:6px;">THEME</label>
                <select id="setTheme" style="width:100%;">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>

            <div style="margin-bottom:18px;">
                <label style="display:block; font-size:0.78rem; color:#868a9c; margin-bottom:6px;">DEFAULT CHART TYPE</label>
                <select id="setDefaultChartType" style="width:100%;">
                    <option value="candles">Candles</option>
                    <option value="line">Line</option>
                </select>
            </div>

            <div style="margin-bottom:18px;">
                <label style="display:block; font-size:0.78rem; color:#868a9c; margin-bottom:6px;">AUTO-APPLY ON NEW CHARTS</label>
                <label style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:0.85rem;">
                    <input type="checkbox" id="setAutoSMA"> SMA 20
                </label>
                <label style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:0.85rem;">
                    <input type="checkbox" id="setAutoEMA"> EMA 50
                </label>
                <label style="display:flex; align-items:center; gap:8px; font-size:0.85rem;">
                    <input type="checkbox" id="setAutoBB"> Bollinger Bands 20,2
                </label>
            </div>

            <div style="margin-bottom:18px;">
                <label style="display:block; font-size:0.78rem; color:#868a9c; margin-bottom:6px;">DEFAULT LOWER PANE</label>
                <select id="setDefaultLower" style="width:100%;">
                    <option value="volume">Volume</option>
                    <option value="rsi">RSI 14</option>
                </select>
            </div>

            <div style="margin-bottom:18px;">
                <label style="display:block; font-size:0.78rem; color:#868a9c; margin-bottom:6px;">VOLUME FORMAT</label>
                <select id="setVolumeFormat" style="width:100%;">
                    <option value="indian">Indian (Lakhs/Crores) - e.g. 1,79,16,507</option>
                    <option value="raw">Raw number</option>
                </select>
            </div>

            <div style="margin-bottom:18px;">
                <label style="display:block; font-size:0.78rem; color:#868a9c; margin-bottom:6px;">PRICE DECIMAL PLACES</label>
                <select id="setDecimals" style="width:100%;">
                    <option value="2">2 (e.g. 735.60)</option>
                    <option value="1">1 (e.g. 735.6)</option>
                    <option value="0">0 (e.g. 736)</option>
                </select>
            </div>

            <button id="saveSettingsBtn" style="width:100%; background:var(--accent); color:white; border-color:var(--accent); padding:9px; margin-top:8px;">Save</button>
            <div id="settingsSavedMsg" style="display:none; text-align:center; color:#26a69a; font-size:0.8rem; margin-top:8px;">Saved - applies to new/reopened charts</div>
        </div>
    </div>

    <div class="tabs-bar" id="tabsBar">
        <button class="add-tab-btn" id="addTabBtn" title="New AmiBroker Tab">+</button>
    </div>

    <div id="workspace"></div>

    <script type="module">
        import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

        // ⚠️ REPLACE THIS WITH YOUR CLOUDFLARE R2 PUBLIC SUBDOMAIN OR CUSTOM DOMAIN
        const R2_BASE_URL = 'https://pub-3a1a560916e2405a9787fd3d3d60d16e.r2.dev';
        // Parquet files available in R2
        const PARQUET_FILES = [
            `${R2_BASE_URL}/2023.parquet`,
            `${R2_BASE_URL}/2024.parquet`,
            `${R2_BASE_URL}/2025.parquet`,
            `${R2_BASE_URL}/2026.parquet`
        ];

        let db = null;
        let conn = null;
        let availableSymbols = [];
        let tabCount = 0;
        let tabs = {};
        let activeTabId = null;
        let LOCAL_PARQUET_FILES = []; // virtual in-memory filenames registered with DuckDB-WASM

        // ---- Settings (Phase 3.5.2): small, synchronous, persisted in
        // localStorage - deliberately separate from the large parquet data
        // cache in IndexedDB, since this is just a handful of preferences.
        const SETTINGS_KEY = 'amibroker-settings-v1';
        const DEFAULT_SETTINGS = {
            theme: 'dark',
            defaultChartType: 'candles',
            autoSMA: false,
            autoEMA: false,
            autoBB: false,
            defaultLower: 'volume',
            volumeFormat: 'indian',
            decimals: 2
        };

        function loadSettings() {
            try {
                const raw = localStorage.getItem(SETTINGS_KEY);
                if (!raw) return { ...DEFAULT_SETTINGS };
                return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
            } catch (e) {
                console.warn('Settings read failed, using defaults:', e);
                return { ...DEFAULT_SETTINGS };
            }
        }

        function saveSettings(settings) {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
            } catch (e) {
                console.warn('Settings save failed (non-fatal):', e);
            }
        }

        let appSettings = loadSettings();

        function applyTheme() {
            document.body.classList.toggle('theme-light', appSettings.theme === 'light');
        }

        // Chart canvases are drawn by the library, not styled via CSS - so theme
        // switching needs to explicitly pass matching colors at chart-creation
        // time, or the chart would stay dark while the surrounding UI goes light.
        function getChartColors() {
            return appSettings.theme === 'light'
                ? { background: '#ffffff', text: '#1a1d26', grid: '#e6e8ee', border: '#d3d7e0' }
                : { background: '#0e1118', text: '#d1d4dc', grid: '#1c202e', border: '#232736' };
        }

        function formatPrice(n) {
            if (n === null || n === undefined || isNaN(n)) return '-';
            return Number(n).toFixed(Number(appSettings.decimals));
        }

        function formatVolume(n) {
            if (n === null || n === undefined || isNaN(n)) return '-';
            return appSettings.volumeFormat === 'raw'
                ? Number(n).toLocaleString('en-US')
                : Number(n).toLocaleString('en-IN');
        }

        function populateSettingsForm() {
            document.getElementById('setTheme').value = appSettings.theme;
            document.getElementById('setDefaultChartType').value = appSettings.defaultChartType;
            document.getElementById('setAutoSMA').checked = appSettings.autoSMA;
            document.getElementById('setAutoEMA').checked = appSettings.autoEMA;
            document.getElementById('setAutoBB').checked = appSettings.autoBB;
            document.getElementById('setDefaultLower').value = appSettings.defaultLower;
            document.getElementById('setVolumeFormat').value = appSettings.volumeFormat;
            document.getElementById('setDecimals').value = String(appSettings.decimals);
        }

        function readSettingsForm() {
            return {
                theme: document.getElementById('setTheme').value,
                defaultChartType: document.getElementById('setDefaultChartType').value,
                autoSMA: document.getElementById('setAutoSMA').checked,
                autoEMA: document.getElementById('setAutoEMA').checked,
                autoBB: document.getElementById('setAutoBB').checked,
                defaultLower: document.getElementById('setDefaultLower').value,
                volumeFormat: document.getElementById('setVolumeFormat').value,
                decimals: Number(document.getElementById('setDecimals').value)
            };
        }

        applyTheme();

        document.getElementById('settingsBtn').addEventListener('click', () => {
            populateSettingsForm();
            document.getElementById('settingsSavedMsg').style.display = 'none';
            document.getElementById('settingsOverlay').style.display = 'block';
        });
        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsOverlay').style.display = 'none';
        });
        document.getElementById('settingsOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'settingsOverlay') document.getElementById('settingsOverlay').style.display = 'none';
        });
        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            appSettings = readSettingsForm();
            saveSettings(appSettings);
            applyTheme();
            document.getElementById('settingsSavedMsg').style.display = 'block';
        });

        // Register the app-shell service worker (Phase 3.5.1 - installable PWA).
        // Wrapped defensively: some browsers/contexts don't support service
        // workers at all, and that must never block the app itself.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.warn('Service worker registration failed (non-fatal):', err);
                });
            });
        }

        // ---- Browser cache layer (Step 2.5: IndexedDB caching of R2 parquet files) ----
        // Past years are immutable once written, so they're cached forever under a plain
        // filename key. The current year's file changes daily (new EOD row appended), so
        // its cache key includes today's date - this naturally "cache-busts" once per day
        // without needing any server-side versioning.
        //
        // CACHE_VERSION: bump this string any time the backend data pipeline changes in a
        // way that invalidates already-cached bytes (e.g. convert.py's filtering logic
        // changed and R2 files were regenerated). Every visitor's IndexedDB cache - past
        // years included - is transparently invalidated and re-downloaded fresh exactly
        // once, without needing anyone to manually clear browser storage on their phone.
        const CACHE_VERSION = 'v8'; // corporate-action adjustment fix - forces re-pull of corrected parquet data
        const CACHE_DB_NAME = 'nse-parquet-cache';
        const CACHE_STORE = 'files';
        const CURRENT_YEAR = new Date().getFullYear();

        function openCacheDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(CACHE_DB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(CACHE_STORE);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function idbGet(key) {
            try {
                const cdb = await openCacheDB();
                return await new Promise((resolve, reject) => {
                    const tx = cdb.transaction(CACHE_STORE, 'readonly');
                    const req = tx.objectStore(CACHE_STORE).get(key);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) {
                console.warn('IndexedDB read failed, falling back to network:', e);
                return null;
            }
        }

        async function idbPut(key, value) {
            try {
                const cdb = await openCacheDB();
                await new Promise((resolve, reject) => {
                    const tx = cdb.transaction(CACHE_STORE, 'readwrite');
                    tx.objectStore(CACHE_STORE).put(value, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                console.warn('IndexedDB write failed (non-fatal, continuing without cache):', e);
            }
        }

        // Downloads each parquet file (from IndexedDB cache if present, else R2), then
        // registers the raw bytes into DuckDB-WASM's virtual filesystem. Queries then read
        // from these in-memory virtual files instead of re-fetching over HTTP every time -
        // this is what makes repeat backtests/chart loads cost 0 R2 reads.
        async function loadParquetFilesWithCache() {
            const localNames = [];
            const todayStr = new Date().toISOString().slice(0, 10);

            for (const url of PARQUET_FILES) {
                const filename = url.split('/').pop();
                const year = parseInt(filename, 10);
                const isCurrentYear = year === CURRENT_YEAR;
                const cacheKey = isCurrentYear
                    ? `${filename}::${CACHE_VERSION}::${todayStr}`
                    : `${filename}::${CACHE_VERSION}`;

                let buffer = await idbGet(cacheKey);
                if (buffer) {
                    document.getElementById('statusBadge').textContent = `Loading ${filename} (cached)...`;
                } else {
                    document.getElementById('statusBadge').textContent = `Downloading ${filename} from R2...`;
                    const resp = await fetch(url);
                    if (!resp.ok) {
                        throw new Error(`Failed to fetch ${filename} from R2: HTTP ${resp.status}`);
                    }
                    buffer = await resp.arrayBuffer();
                    await idbPut(cacheKey, buffer);
                }

                const localName = `local_${filename}`;
                await db.registerFileBuffer(localName, new Uint8Array(buffer));
                localNames.push(localName);
            }

            return localNames;
        }

        // Initialize DuckDB-WASM Engine
        async function initDuckDB() {
            try {
                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);

                // Browsers block `new Worker(crossOriginUrl)` directly (Worker scripts must
                // be same-origin). Fetch the worker script text ourselves and instantiate it
                // from a same-origin Blob URL instead - this is the standard workaround when
                // loading DuckDB-WASM's worker from a CDN like jsDelivr.
                const workerScript = await fetch(bundle.mainWorker).then(r => r.text());
                const workerBlobUrl = URL.createObjectURL(
                    new Blob([workerScript], { type: 'text/javascript' })
                );
                const worker = new Worker(workerBlobUrl);
                const logger = new duckdb.ConsoleLogger();
                db = new duckdb.AsyncDuckDB(logger, worker);
                await db.instantiate(bundle.mainModule);
                URL.revokeObjectURL(workerBlobUrl);
                conn = await db.connect();

                console.log("DuckDB-WASM initialized successfully.");
                LOCAL_PARQUET_FILES = await loadParquetFilesWithCache();
                await fetchSymbolsFromR2();
            } catch (err) {
                console.error("DuckDB initialization failed:", err);
                document.getElementById('statusBadge').textContent = 'DuckDB / R2 Error';
                document.getElementById('statusBadge').className = 'status-badge status-error';
                const detail = document.getElementById('errorDetail');
                detail.style.display = 'block';
                detail.textContent = 'INIT FAILED: ' + (err && err.message ? err.message : String(err));
            }
        }


        // Fetch distinct symbols directly from Parquet stored in Cloudflare R2
        async function fetchSymbolsFromR2() {
            try {
                // Structural filter instead of guessing bad string values: a real, actively
                // traded stock has hundreds of trading days across 2023-2026. A junk/test
                // row (however it got in, whatever it's literally spelled as) will have only
                // a handful of rows at most. Requiring a minimum row count with valid prices
                // eliminates this whole category of bad data at once, rather than needing to
                // know in advance what the bad value looks like.
                const query = `
                    SELECT Symbol
                    FROM read_parquet([${LOCAL_PARQUET_FILES.map(f => `'${f}'`).join(',')}])
                    WHERE Symbol IS NOT NULL AND TRIM(Symbol) <> ''
                    GROUP BY Symbol
                    HAVING COUNT(*) >= 50
                       AND SUM(CASE WHEN Close IS NOT NULL AND Close > 0
                                     AND Open IS NOT NULL AND Open > 0
                                THEN 1 ELSE 0 END) >= 50
                    ORDER BY Symbol ASC
                `;
                
                const result = await conn.query(query);
                const rawRows = result.toArray().map(row => row.toJSON());

                // Defensive extraction: don't assume the JS object key is exactly
                // "Symbol" - depending on the DuckDB-WASM/Arrow binding, it can come
                // back with different casing. Since this query selects exactly one
                // column, grabbing the first (only) value works regardless of what
                // the key is actually named.
                availableSymbols = rawRows.map(obj => obj.Symbol ?? obj.symbol ?? Object.values(obj)[0]);

                // One-time diagnostic: if extraction still failed (first symbol is
                // falsy despite the query returning rows), show the raw shape of a
                // row on-screen so we can see exactly what DuckDB actually returned,
                // instead of silently falling through to a placeholder symbol.
                if (rawRows.length > 0 && !availableSymbols[0]) {
                    const detail = document.getElementById('errorDetail');
                    detail.style.display = 'block';
                    detail.textContent = 'SYMBOL EXTRACTION FAILED - raw first row from query: ' + JSON.stringify(rawRows[0]);
                }

                const select = document.getElementById('symbolSelect');
                select.innerHTML = '';
                availableSymbols.forEach(sym => {
                    const opt = document.createElement('option');
                    opt.value = sym;
                    opt.textContent = sym;
                    select.appendChild(opt);
                });

                document.getElementById('statusBadge').textContent = `${availableSymbols.length} Symbols (R2)`;
                document.getElementById('statusBadge').className = 'status-badge status-online';

                if (availableSymbols.length > 0) {
                    // Don't just take availableSymbols[0] (alphabetically first) - a
                    // contaminated index/segment-summary row can still slip through
                    // sorting-based defaults even after filtering. Actively seek a
                    // known, liquid, real stock first; only fall back to "first in
                    // list minus obvious non-tickers" if none of those are present
                    // (e.g. a very narrow custom dataset).
                    const PREFERRED_DEFAULTS = ['RELIANCE', 'TCS', 'INFY', 'HDFCBANK', 'ICICIBANK', 'SBIN'];
                    const KNOWN_BAD = ['NSE', 'BSE', 'NIFTY', 'NIFTY 50', 'SENSEX'];
                    const normalize = s => String(s).replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().trim();

                    let defaultSymbol = availableSymbols.find(s => PREFERRED_DEFAULTS.includes(normalize(s)));
                    if (!defaultSymbol) {
                        defaultSymbol = availableSymbols.find(s => !KNOWN_BAD.includes(normalize(s)));
                    }
                    createNewTab(defaultSymbol || availableSymbols[0]);
                }
            } catch (err) {
                console.error("Failed to fetch symbols from R2 Parquet:", err);
                document.getElementById('statusBadge').textContent = 'R2 Read Error';
                document.getElementById('statusBadge').className = 'status-badge status-error';
                const detail = document.getElementById('errorDetail');
                detail.style.display = 'block';
                detail.textContent = 'R2 READ FAILED: ' + (err && err.message ? err.message : String(err)) + '\n\nFiles attempted:\n' + PARQUET_FILES.join('\n');
            }
        }

        // Technical Indicators
        function calculateSMA(data, period) {
            let res = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) continue;
                let sum = 0;
                for (let j = 0; j < period; j++) sum += data[i - j].close;
                res.push({ time: data[i].time, value: sum / period });
            }
            return res;
        }

        function calculateEMA(data, period) {
            let res = [];
            let k = 2 / (period + 1);
            let prevEMA = null;
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) continue;
                if (prevEMA === null) {
                    let sum = 0;
                    for (let j = 0; j < period; j++) sum += data[i - j].close;
                    prevEMA = sum / period;
                } else {
                    prevEMA = (data[i].close * k) + (prevEMA * (1 - k));
                }
                res.push({ time: data[i].time, value: prevEMA });
            }
            return res;
        }

        function calculateBollingerBands(data, period = 20, mult = 2) {
            let upper = [], lower = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) continue;
                let slice = data.slice(i - period + 1, i + 1);
                let mean = slice.reduce((a, b) => a + b.close, 0) / period;
                let variance = slice.reduce((a, b) => a + Math.pow(b.close - mean, 2), 0) / period;
                let stdDev = Math.sqrt(variance);
                upper.push({ time: data[i].time, value: mean + (stdDev * mult) });
                lower.push({ time: data[i].time, value: mean - (stdDev * mult) });
            }
            return { upper, lower };
        }

        function calculateRSI(data, period = 14) {
            let res = [];
            if (data.length <= period) return res;
            let gains = 0, losses = 0;

            for (let i = 1; i <= period; i++) {
                let diff = data[i].close - data[i - 1].close;
                if (diff >= 0) gains += diff; else losses += Math.abs(diff);
            }

            let avgGain = gains / period, avgLoss = losses / period;
            let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
            res.push({ time: data[period].time, value: 100 - (100 / (1 + rs)) });

            for (let i = period + 1; i < data.length; i++) {
                let diff = data[i].close - data[i - 1].close;
                let gain = diff >= 0 ? diff : 0, loss = diff < 0 ? Math.abs(diff) : 0;
                avgGain = (avgGain * (period - 1) + gain) / period;
                avgLoss = (avgLoss * (period - 1) + loss) / period;
                rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
                res.push({ time: data[i].time, value: 100 - (100 / (1 + rs)) });
            }
            return res;
        }

        // Workspace Tab Setup
        function createNewTab(symbol) {
            tabCount++;
            const tabId = `tab-${tabCount}`;
            const targetSymbol = symbol || availableSymbols[0] || 'NIFTY_UNAVAILABLE';

            const tabsBar = document.getElementById('tabsBar');
            const addBtn = document.getElementById('addTabBtn');
            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = `header-${tabId}`;
            tabEl.innerHTML = `
                <span class="tab-title">${targetSymbol}</span>
                <span class="close-tab" id="close-${tabId}">✕</span>
            `;
            tabEl.onclick = () => switchTab(tabId);
            tabsBar.insertBefore(tabEl, addBtn);

            document.getElementById(`close-${tabId}`).onclick = (e) => closeTab(tabId, e);

            const workspace = document.getElementById('workspace');
            const contentEl = document.createElement('div');
            contentEl.className = 'tab-content';
            contentEl.id = `content-${tabId}`;
            contentEl.innerHTML = `
                <div class="pane-upper" id="upper-${tabId}">
                    <div class="pane-controls">
                        <select id="style-${tabId}">
                            <option value="candles">Candles</option>
                            <option value="line">Line</option>
                        </select>
                        <button class="btn-sma" id="btn-sma-${tabId}">SMA 20</button>
                        <button class="btn-ema" id="btn-ema-${tabId}">EMA 50</button>
                        <button class="btn-bb" id="btn-bb-${tabId}">BB 20,2</button>
                        <button class="btn-draw" id="btn-draw-trendline-${tabId}" title="Trend Line">/ Line</button>
                    </div>
                    <div class="ohlc-legend" id="legend-${tabId}"></div>
                    <svg class="drawing-overlay" id="drawing-svg-${tabId}"></svg>
                </div>
                <div class="pane-lower" id="lower-${tabId}">
                    <div class="pane-controls">
                        <button class="btn-vol btn-active" id="btn-vol-${tabId}">Volume</button>
                        <button class="btn-rsi" id="btn-rsi-${tabId}">RSI 14</button>
                    </div>
                </div>
            `;
            workspace.appendChild(contentEl);

            // Make this tab visible BEFORE creating its charts. createChart() measures
            // the container's size at creation time - if it's still display:none (the
            // default .tab-content state until switchTab() runs), the chart is built
            // with zero width/height, which throws an internal "Value is null" error on
            // the very first setData() call. It self-corrects moments later via the
            // chart library's own resize observer once the container becomes visible -
            // but that produces a confusing flash of a false error first. Making the
            // container visible up front avoids that entirely. switchTab() is still
            // called normally later to handle the tab-header/active-symbol bookkeeping.
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            contentEl.classList.add('active');
            // Adding the class above changes the DOM, but the browser doesn't
            // necessarily recompute layout synchronously just from that - and
            // createChart() below runs in this same script tick. Reading a
            // layout-dependent property forces the browser to flush/recalculate
            // layout immediately, so the container's real (now-visible) size is
            // what the charts actually measure, instead of a stale zero size.
            void contentEl.offsetHeight;

            document.getElementById(`style-${tabId}`).value = appSettings.defaultChartType;
            document.getElementById(`style-${tabId}`).onchange = (e) => changeChartStyle(tabId, e.target.value);
            document.getElementById(`btn-sma-${tabId}`).onclick = () => toggleOverlay(tabId, 'sma');
            document.getElementById(`btn-ema-${tabId}`).onclick = () => toggleOverlay(tabId, 'ema');
            document.getElementById(`btn-bb-${tabId}`).onclick = () => toggleOverlay(tabId, 'bb');
            document.getElementById(`btn-vol-${tabId}`).onclick = () => setLowerIndicator(tabId, 'volume');
            document.getElementById(`btn-rsi-${tabId}`).onclick = () => setLowerIndicator(tabId, 'rsi');

            const priceFormat = {
                type: 'price',
                precision: Number(appSettings.decimals),
                minMove: 1 / Math.pow(10, Number(appSettings.decimals))
            };

            const chartColors = getChartColors();

            const upperChart = LightweightCharts.createChart(document.getElementById(`upper-${tabId}`), {
                layout: { backgroundColor: chartColors.background, textColor: chartColors.text },
                grid: { vertLines: { color: chartColors.grid }, horzLines: { color: chartColors.grid } },
                rightPriceScale: { borderColor: chartColors.border },
                timeScale: { borderColor: chartColors.border, visible: false }
            });

            const lowerChart = LightweightCharts.createChart(document.getElementById(`lower-${tabId}`), {
                layout: { backgroundColor: chartColors.background, textColor: chartColors.text },
                grid: { vertLines: { color: chartColors.grid }, horzLines: { color: chartColors.grid } },
                rightPriceScale: { borderColor: chartColors.border },
                timeScale: { borderColor: chartColors.border, visible: true }
            });

            // Note: subscribeVisibleTimeRangeChange is the correct subscribe method name,
            // but the corresponding setter on the *other* chart is setVisibleRange - there
            // is no setVisibleTimeRange method in lightweight-charts v4's API.
            upperChart.timeScale().subscribeVisibleTimeRangeChange(r => {
                if (r) lowerChart.timeScale().setVisibleRange(r);
                renderDrawings(tabId); // panning/zooming moves pixel positions - redraw
            });
            lowerChart.timeScale().subscribeVisibleTimeRangeChange(r => { if (r) upperChart.timeScale().setVisibleRange(r); });

            // Build the initial price series matching the user's default chart type
            // setting directly, rather than always creating candles then switching -
            // avoids a wasteful create/remove churn on every single new tab.
            let mainSeries = null;
            let lineSeries = null;
            if (appSettings.defaultChartType === 'line') {
                lineSeries = upperChart.addLineSeries({ color: '#2962ff', lineWidth: 2, priceFormat });
            } else {
                mainSeries = upperChart.addCandlestickSeries({
                    upColor: '#26a69a', downColor: '#ef5350',
                    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
                    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
                    priceFormat
                });
            }

            const volumeSeries = lowerChart.addHistogramSeries({
                priceFormat: { type: 'volume' }
            });

            tabs[tabId] = {
                symbol: targetSymbol,
                chartStyle: appSettings.defaultChartType,
                upperChart, lowerChart,
                mainSeries, volumeSeries,
                lineSeries, rsiSeries: null,
                data: [],
                overlays: { sma: null, ema: null, bbUpper: null, bbLower: null },
                // Phase 3 Group B: drawing tools. drawMode is null (off) or a tool
                // name ('trendline'). pendingPoint holds the first tap while a
                // two-point tool is mid-draw. selectedDrawingId tracks which drawn
                // object is currently selected (for the delete button).
                drawings: [],
                drawMode: null,
                pendingPoint: null,
                selectedDrawingId: null
            };

            // Live OHLC legend that follows the crosshair/finger across the chart -
            // looks up the hovered candle's data and shows it top-right, AmiBroker-style.
            upperChart.subscribeCrosshairMove(param => {
                const legend = document.getElementById(`legend-${tabId}`);
                if (!legend) return;
                const t = tabs[tabId];
                if (!param || !param.time || !t) {
                    legend.style.display = 'none';
                    return;
                }
                const point = t.data.find(d => d.time === param.time);
                if (!point) {
                    legend.style.display = 'none';
                    return;
                }
                const cls = point.close >= point.open ? 'up' : 'down';
                legend.style.display = 'block';
                legend.innerHTML =
                    `<b>${t.symbol}</b> &nbsp;O <span class="${cls}">${formatPrice(point.open)}</span>` +
                    ` &nbsp;H <span class="${cls}">${formatPrice(point.high)}</span>` +
                    ` &nbsp;L <span class="${cls}">${formatPrice(point.low)}</span>` +
                    ` &nbsp;C <span class="${cls}">${formatPrice(point.close)}</span>` +
                    ` &nbsp;Vol <span class="${cls}">${formatVolume(point.volume)}</span>`;
            });

            // Drawing tool click handling. chart.subscribeClick gives us both the
            // time (directly) and pixel point (for price conversion) in one place -
            // cleaner than manually converting from raw DOM click coordinates.
            upperChart.subscribeClick(param => {
                const t = tabs[tabId];
                if (!t || !param.point || !param.time) return;

                if (t.drawMode === 'trendline') {
                    const price = t.mainSeries
                        ? t.mainSeries.coordinateToPrice(param.point.y)
                        : t.lineSeries.coordinateToPrice(param.point.y);
                    if (price === null) return;
                    const point = { time: param.time, price };

                    if (!t.pendingPoint) {
                        t.pendingPoint = point;
                    } else {
                        t.drawings.push({
                            id: `draw-${Date.now()}`,
                            type: 'trendline',
                            p1: t.pendingPoint,
                            p2: point
                        });
                        t.pendingPoint = null;
                        t.drawMode = null;
                        const btn = document.getElementById(`btn-draw-trendline-${tabId}`);
                        if (btn) btn.classList.remove('tool-active');
                        renderDrawings(tabId);
                    }
                }
            });

            document.getElementById(`btn-draw-trendline-${tabId}`).addEventListener('click', () => {
                const t = tabs[tabId];
                const btn = document.getElementById(`btn-draw-trendline-${tabId}`);
                if (t.drawMode === 'trendline') {
                    t.drawMode = null;
                    t.pendingPoint = null;
                    btn.classList.remove('tool-active');
                } else {
                    t.drawMode = 'trendline';
                    t.pendingPoint = null;
                    btn.classList.add('tool-active');
                }
            });

            switchTab(tabId);
            loadDataForTab(tabId, targetSymbol).then(() => {
                // Auto-apply settings-driven defaults now that real data exists -
                // deliberately done AFTER load, not before, since toggling these
                // early would just compute indicators against an empty data set.
                if (appSettings.autoSMA) toggleOverlay(tabId, 'sma');
                if (appSettings.autoEMA) toggleOverlay(tabId, 'ema');
                if (appSettings.autoBB) toggleOverlay(tabId, 'bb');
                if (appSettings.defaultLower === 'rsi') setLowerIndicator(tabId, 'rsi');
                renderDrawings(tabId);
            });
        }

        function switchTab(tabId) {
            activeTabId = tabId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            document.getElementById(`header-${tabId}`).classList.add('active');
            document.getElementById(`content-${tabId}`).classList.add('active');

            if (tabs[tabId] && tabs[tabId].symbol) {
                document.getElementById('symbolSelect').value = tabs[tabId].symbol;
            }

            window.dispatchEvent(new Event('resize'));
        }

        function closeTab(tabId, e) {
            e.stopPropagation();
            if (Object.keys(tabs).length <= 1) return;

            document.getElementById(`header-${tabId}`).remove();
            document.getElementById(`content-${tabId}`).remove();
            delete tabs[tabId];

            const remaining = Object.keys(tabs);
            switchTab(remaining[remaining.length - 1]);
        }

        // Query stock data directly from Cloudflare R2 Parquet files via DuckDB-WASM
        async function loadDataForTab(tabId, symbol) {
            const tab = tabs[tabId];
            tab.symbol = symbol;
            document.querySelector(`#header-${tabId} .tab-title`).textContent = symbol;

            try {
                const query = `
                    SELECT 
                        CAST(Date AS STRING) as time,
                        Open as open,
                        High as high,
                        Low as low,
                        Close as close,
                        Volume as volume
                    FROM read_parquet([${LOCAL_PARQUET_FILES.map(f => `'${f}'`).join(',')}])
                    WHERE UPPER(Symbol) = '${symbol.toUpperCase()}'
                    ORDER BY Date ASC
                `;

                const result = await conn.query(query);
                const raw = result.toArray().map(row => row.toJSON());

                tab.data = raw.map(d => ({
                    time: d.time.split('T')[0],
                    open: Number(d.open),
                    high: Number(d.high),
                    low: Number(d.low),
                    close: Number(d.close),
                    volume: Number(d.volume || 0)
                }));

                // Each rendering step is independent and must run even if an earlier
                // one fails - e.g. if the candlestick series throws (a transient
                // layout-timing issue), that must NOT prevent the volume bars or
                // indicators from still receiving their data. Errors are collected
                // and shown together at the end instead of aborting on the first one.
                const stepErrors = [];

                const setMainSeriesData = () => {
                    if (tab.chartStyle === 'candles') {
                        tab.mainSeries.setData(tab.data);
                    } else if (tab.lineSeries) {
                        tab.lineSeries.setData(tab.data.map(d => ({ time: d.time, value: d.close })));
                    }
                };

                try {
                    setMainSeriesData();
                } catch (stepErr) {
                    // Known benign timing quirk: on a brand-new tab, the chart can
                    // occasionally measure a zero-size container on the very first
                    // paint despite the earlier reflow fix. Retrying one frame later,
                    // once layout has definitely settled, reliably succeeds silently -
                    // confirmed harmless and self-recovering across repeated testing,
                    // so it's retried quietly here instead of surfacing a scary error
                    // for something that fixes itself immediately either way.
                    requestAnimationFrame(() => {
                        try {
                            setMainSeriesData();
                            tab.upperChart.timeScale().fitContent();
                        } catch (retryErr) {
                            console.error('Main price series retry also failed:', retryErr);
                        }
                    });
                }

                try {
                    tab.volumeSeries.setData(tab.data.map(d => ({
                        time: d.time,
                        value: d.volume,
                        color: d.close >= d.open ? 'rgba(38, 166, 154, 0.6)' : 'rgba(239, 83, 80, 0.6)'
                    })));
                } catch (stepErr) {
                    stepErrors.push(`[volume series] ${stepErr.message}`);
                }

                try {
                    refreshOverlays(tabId);
                } catch (stepErr) {
                    stepErrors.push(`[indicator overlays] ${stepErr.message}`);
                }

                try {
                    tab.upperChart.timeScale().fitContent();
                } catch (stepErr) {
                    stepErrors.push(`[fitContent] ${stepErr.message}`);
                }

                if (tab.data.length === 0) {
                    const detail = document.getElementById('errorDetail');
                    detail.style.display = 'block';
                    detail.textContent = `NO DATA for symbol "${symbol}". Query ran successfully but returned 0 rows - check that the Symbol value matches exactly what's stored in the parquet files (case, spacing, suffix like .NS/.NSE).`;
                } else if (stepErrors.length > 0) {
                    const detail = document.getElementById('errorDetail');
                    detail.style.display = 'block';
                    detail.textContent = `CHART RENDER ISSUE(S) for "${symbol}" (data loaded fine, some drawing steps hit a snag - usually harmless/self-recovering):\n` + stepErrors.join('\n');
                }
            } catch (e) {
                console.error("DuckDB R2 Query Error:", e);
                const detail = document.getElementById('errorDetail');
                detail.style.display = 'block';
                detail.textContent = `CHART DATA QUERY FAILED for "${symbol}": ` + (e && e.message ? e.message : String(e));
            }
        }

        function changeChartStyle(tabId, style) {
            const tab = tabs[tabId];
            tab.chartStyle = style;
            if (style === 'line') {
                tab.upperChart.removeSeries(tab.mainSeries);
                tab.lineSeries = tab.upperChart.addLineSeries({ color: '#2962ff', lineWidth: 2 });
                tab.lineSeries.setData(tab.data.map(d => ({ time: d.time, value: d.close })));
            } else {
                if (tab.lineSeries) {
                    tab.upperChart.removeSeries(tab.lineSeries);
                    tab.lineSeries = null;
                }
                tab.mainSeries = tab.upperChart.addCandlestickSeries({
                    upColor: '#26a69a', downColor: '#ef5350',
                    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
                    wickUpColor: '#26a69a', wickDownColor: '#ef5350'
                });
                tab.mainSeries.setData(tab.data);
            }
            refreshOverlays(tabId);
        }

        function toggleOverlay(tabId, type) {
            const tab = tabs[tabId];
            const btn = document.getElementById(`btn-${type}-${tabId}`);

            if (type === 'sma') {
                if (tab.overlays.sma) {
                    tab.upperChart.removeSeries(tab.overlays.sma);
                    tab.overlays.sma = null;
                    btn.classList.remove('btn-active');
                } else {
                    tab.overlays.sma = tab.upperChart.addLineSeries({ color: '#2962ff', lineWidth: 2 });
                    tab.overlays.sma.setData(calculateSMA(tab.data, 20));
                    btn.classList.add('btn-active');
                }
            } else if (type === 'ema') {
                if (tab.overlays.ema) {
                    tab.upperChart.removeSeries(tab.overlays.ema);
                    tab.overlays.ema = null;
                    btn.classList.remove('btn-active');
                } else {
                    tab.overlays.ema = tab.upperChart.addLineSeries({ color: '#ff6d00', lineWidth: 2 });
                    tab.overlays.ema.setData(calculateEMA(tab.data, 50));
                    btn.classList.add('btn-active');
                }
            } else if (type === 'bb') {
                if (tab.overlays.bbUpper) {
                    tab.upperChart.removeSeries(tab.overlays.bbUpper);
                    tab.upperChart.removeSeries(tab.overlays.bbLower);
                    tab.overlays.bbUpper = null;
                    tab.overlays.bbLower = null;
                    btn.classList.remove('btn-active');
                } else {
                    const bb = calculateBollingerBands(tab.data, 20, 2);
                    tab.overlays.bbUpper = tab.upperChart.addLineSeries({ color: '#ab47bc', lineWidth: 1 });
                    tab.overlays.bbLower = tab.upperChart.addLineSeries({ color: '#ab47bc', lineWidth: 1 });
                    tab.overlays.bbUpper.setData(bb.upper);
                    tab.overlays.bbLower.setData(bb.lower);
                    btn.classList.add('btn-active');
                }
            }
        }

        function setLowerIndicator(tabId, type) {
            const tab = tabs[tabId];
            const volBtn = document.getElementById(`btn-vol-${tabId}`);
            const rsiBtn = document.getElementById(`btn-rsi-${tabId}`);

            if (type === 'volume') {
                if (tab.rsiSeries) {
                    tab.lowerChart.removeSeries(tab.rsiSeries);
                    tab.rsiSeries = null;
                }
                tab.volumeSeries.applyOptions({ visible: true });
                volBtn.classList.add('btn-active');
                rsiBtn.classList.remove('btn-active');
            } else if (type === 'rsi') {
                tab.volumeSeries.applyOptions({ visible: false });
                if (!tab.rsiSeries) {
                    tab.rsiSeries = tab.lowerChart.addLineSeries({ color: '#e91e63', lineWidth: 2 });
                    tab.rsiSeries.setData(calculateRSI(tab.data, 14));
                }
                rsiBtn.classList.add('btn-active');
                volBtn.classList.remove('btn-active');
            }
        }

        // Phase 3 Group B: renders every drawing object as SVG elements positioned
        // via the chart's own time/price -> pixel coordinate conversion. Called on
        // initial load, after adding/removing a drawing, and whenever the visible
        // time range or container size changes (pan/zoom/resize all shift pixel
        // positions even though the underlying time/price anchors don't move).
        function renderDrawings(tabId) {
            const tab = tabs[tabId];
            const svg = document.getElementById(`drawing-svg-${tabId}`);
            if (!tab || !svg) return;

            svg.innerHTML = '';
            const priceSeries = tab.mainSeries || tab.lineSeries;
            if (!priceSeries) return;

            tab.drawings.forEach(d => {
                if (d.type !== 'trendline') return;
                const x1 = tab.upperChart.timeScale().timeToCoordinate(d.p1.time);
                const y1 = priceSeries.priceToCoordinate(d.p1.price);
                const x2 = tab.upperChart.timeScale().timeToCoordinate(d.p2.time);
                const y2 = priceSeries.priceToCoordinate(d.p2.price);
                if (x1 === null || y1 === null || x2 === null || y2 === null) return;

                const isSelected = tab.selectedDrawingId === d.id;
                const ns = 'http://www.w3.org/2000/svg';

                // A wide, invisible line sits under the visible one purely to make
                // the line easy to tap on a touchscreen (the visible line itself is
                // only 2px wide - far too thin to reliably tap with a finger).
                const hitLine = document.createElementNS(ns, 'line');
                hitLine.setAttribute('x1', x1); hitLine.setAttribute('y1', y1);
                hitLine.setAttribute('x2', x2); hitLine.setAttribute('y2', y2);
                hitLine.setAttribute('class', 'draw-line-hit');
                hitLine.addEventListener('click', () => {
                    tab.selectedDrawingId = (tab.selectedDrawingId === d.id) ? null : d.id;
                    renderDrawings(tabId);
                });
                svg.appendChild(hitLine);

                const line = document.createElementNS(ns, 'line');
                line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                line.setAttribute('class', 'draw-line' + (isSelected ? ' selected' : ''));
                svg.appendChild(line);

                if (isSelected) {
                    const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
                    const g = document.createElementNS(ns, 'g');
                    g.setAttribute('class', 'draw-delete-btn');
                    g.addEventListener('click', () => {
                        tab.drawings = tab.drawings.filter(dr => dr.id !== d.id);
                        tab.selectedDrawingId = null;
                        renderDrawings(tabId);
                    });
                    const circle = document.createElementNS(ns, 'circle');
                    circle.setAttribute('cx', midX); circle.setAttribute('cy', midY); circle.setAttribute('r', 10);
                    const text = document.createElementNS(ns, 'text');
                    text.setAttribute('x', midX); text.setAttribute('y', midY);
                    text.textContent = '\u00d7';
                    g.appendChild(circle); g.appendChild(text);
                    svg.appendChild(g);
                }
            });
        }

        function refreshOverlays(tabId) {
            const tab = tabs[tabId];
            if (tab.overlays.sma) tab.overlays.sma.setData(calculateSMA(tab.data, 20));
            if (tab.overlays.ema) tab.overlays.ema.setData(calculateEMA(tab.data, 50));
            if (tab.overlays.bbUpper) {
                const bb = calculateBollingerBands(tab.data, 20, 2);
                tab.overlays.bbUpper.setData(bb.upper);
                tab.overlays.bbLower.setData(bb.lower);
            }
            if (tab.rsiSeries) tab.rsiSeries.setData(calculateRSI(tab.data, 14));
        }

        document.getElementById('loadBtn').onclick = () => {
            const sym = document.getElementById('symbolSelect').value;
            if (sym && activeTabId) loadDataForTab(activeTabId, sym);
        };

        document.getElementById('addTabBtn').onclick = () => {
            const sym = document.getElementById('symbolSelect').value;
            createNewTab(sym);
        };

        window.addEventListener('resize', () => {
            Object.keys(tabs).forEach(tabId => {
                const tab = tabs[tabId];
                const upperEl = document.getElementById(`upper-${tabId}`);
                const lowerEl = document.getElementById(`lower-${tabId}`);
                if (upperEl && lowerEl) {
                    tab.upperChart.applyOptions({ width: upperEl.clientWidth, height: upperEl.clientHeight });
                    tab.lowerChart.applyOptions({ width: lowerEl.clientWidth, height: lowerEl.clientHeight });
                    renderDrawings(tabId); // resize shifts pixel positions - keep drawings anchored
                }
            });
        });

        // Initialize application
        initDuckDB();
    </script>
</body>
</html>
