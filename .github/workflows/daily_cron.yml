name: Daily NSE Data Fetcher

on:
  schedule:
    # Runs at 12:30 PM UTC (6:00 PM IST) Monday through Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: false
        default: '2023-12-01'
      end_date:
        description: 'End Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    
    # GRANT WRITE PERMISSIONS TO GITHUB ACTIONS BOT
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Run Fetcher Script
      env:
        START_DATE: ${{ github.event.inputs.start_date || '2023-12-01' }}
        END_DATE: ${{ github.event.inputs.end_date }}
      run: python fetch_data.py

    - name: Commit and Push Updated Database
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add nse_eod_data.db corporate_actions.db || true
        git commit -m "Automated update: NSE Bhavcopy EOD Data" || exit 0
        git pull --rebase origin main
        git push origin main
