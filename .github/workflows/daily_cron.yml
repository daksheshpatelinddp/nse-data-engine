name: Daily NSE Fetcher

on:
  schedule:
    - cron: '0 13 * * 1-5' # Runs automatically Monday to Friday
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD) - leave default or set specific date'
        required: false
        default: '2000-01-01'
      end_date:
        description: 'End Date (YYYY-MM-DD) - leave empty for today'
        required: false
        default: ''
      run_ca_backfill:
        description: 'Also backfill historical corporate-action dates (slow, one-time; leave unchecked for normal runs)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Clean Corrupted Databases
      run: |
        python -c "
        import os, sqlite3
        db_dir = 'data/databases'
        os.makedirs(db_dir, exist_ok=True)
        for f in os.listdir(db_dir):
            if f.endswith('.db'):
                path = os.path.join(db_dir, f)
                try:
                    conn = sqlite3.connect(path)
                    conn.execute('PRAGMA quick_check;')
                    conn.close()
                except Exception as e:
                    print(f'Removing corrupted file: {path}')
                    os.remove(path)
        "

    - name: Determine Fetch Date Range
      id: dates
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          LAST_DATE=$(python3 -c "
        import os, sqlite3
        db_dir = 'data/databases'
        dates = []
        if os.path.isdir(db_dir):
            for f in os.listdir(db_dir):
                if f.startswith('nse_') and f.endswith('.db') and f[4:8].isdigit():
                    try:
                        conn = sqlite3.connect(os.path.join(db_dir, f))
                        row = conn.execute('SELECT MAX(date) FROM ohlcv').fetchone()
                        conn.close()
                        if row and row[0]:
                            dates.append(row[0])
                    except Exception:
                        pass
        print(max(dates) if dates else '')
        ")
          if [ -n "$LAST_DATE" ]; then
            START=$(date -d "$LAST_DATE + 1 day" +%Y-%m-%d)
          else
            START=$(date +%Y-%m-%d)
          fi
          END=$(date +%Y-%m-%d)
          echo "start_date=$START" >> "$GITHUB_OUTPUT"
          echo "end_date=$END" >> "$GITHUB_OUTPUT"
        else
          START_INPUT="${{ github.event.inputs.start_date }}"
          END_INPUT="${{ github.event.inputs.end_date }}"

          # If end_date is omitted during manual run, default to today
          if [ -z "$END_INPUT" ]; then
            END_INPUT=$(date +%Y-%m-%d)
          fi

          echo "start_date=$START_INPUT" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_INPUT" >> "$GITHUB_OUTPUT"
        fi

    - name: Run Fetcher Script
      run: python backend/fetch_data.py
      env:
        START_DATE: ${{ steps.dates.outputs.start_date || '2000-01-01' }}
        END_DATE: ${{ steps.dates.outputs.end_date || '' }}
        RUN_CA_BACKFILL: ${{ github.event.inputs.run_ca_backfill || 'false' }}

    - name: Commit and Push Updated Databases
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

        # Remove LFS tracking manually for database files
        git rm --cached data/databases/nse_*.db || true

        git add data/databases/nse_*.db
        git commit -m "Automated update: Yearly NSE Databases" || exit 0
        git pull --rebase origin main
        git push origin main