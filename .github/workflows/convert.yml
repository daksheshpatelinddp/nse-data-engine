name: Convert DB to Parquet & Upload R2

# Manual only. The daily conversion now runs inside "Publish ALL" (publish_all.yml) together with the AmiBroker CSV export.
on:
  workflow_dispatch:

jobs:
  convert-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow boto3

      - name: Dividend list and report (cash dividends are applied to the prices while converting)
        continue-on-error: true
        run: python backend/dividends.py --report

      - name: Save dividend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dividend-report
          path: data/corporate_actions/dividend-report.txt
          if-no-files-found: ignore

      - name: Run Conversion Script
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          FORCE_ALL: 'true'    # manual run = rebuild everything
        run: |
          python backend/convert.py
