name: Daily NSE Fetcher

on:
  schedule:
    - cron: '0 13 * * 1-5' # Runs automatically Monday to Friday
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: false
        default: '2000-01-01'
      end_date:
        description: 'End Date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Clean Corrupted Databases
      run: |
        python -c "
        import os, sqlite3
        for f in os.listdir('.'):
            if f.endswith('.db'):
                try:
                    conn = sqlite3.connect(f)
                    conn.execute('PRAGMA quick_check;')
                    conn.close()
                except Exception as e:
                    print(f'Removing corrupted file: {f}')
                    os.remove(f)
        "

    - name: Run Fetcher Script
      run: python fetch_data.py
      env:
        START_DATE: ${{ github.event.inputs.start_date || '2000-01-01' }}
        END_DATE: ${{ github.event.inputs.end_date || '' }}

    - name: Commit and Push Updated Databases
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add nse_*.db
        git commit -m "Automated update: Yearly NSE Databases" || exit 0
        git stash --include-untracked
        git pull --rebase origin main
        git push origin main