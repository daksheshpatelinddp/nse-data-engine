<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmiBroker Web Workstation</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1118; color: #d1d4dc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Navigation Bar */
        header { background: #161a25; border-bottom: 1px solid #232736; padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .logo { font-weight: bold; color: #2962ff; font-size: 1.1rem; margin-right: 6px; }
        select, button { background: #232736; color: #e0e3eb; border: 1px solid #31364a; border-radius: 4px; padding: 5px 10px; font-size: 0.82rem; cursor: pointer; outline: none; }
        select:focus, button:focus { border-color: #2962ff; }
        button:hover { background: #2c3244; }
        .btn-active { background: #2962ff !important; color: white; border-color: #2962ff; }
        
        /* Tab Navigation Bar */
        .tabs-bar { background: #12151e; display: flex; align-items: center; border-bottom: 1px solid #232736; overflow-x: auto; white-space: nowrap; }
        .tab { padding: 7px 14px; background: #181c28; border-right: 1px solid #232736; color: #787b86; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; user-select: none; }
        .tab.active { background: #0e1118; color: #2962ff; border-top: 2px solid #2962ff; font-weight: 600; }
        .tab .close-tab { border-radius: 50%; width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; }
        .tab .close-tab:hover { background: #2c3244; color: white; }
        .add-tab-btn { padding: 4px 10px; background: transparent; border: none; color: #2962ff; font-size: 1.2rem; cursor: pointer; }
        
        /* Main Workspace Container */
        #workspace { flex: 1; position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
        .tab-content { display: none; flex: 1; flex-direction: column; width: 100%; height: 100%; position: relative; }
        .tab-content.active { display: flex; }
        
        /* AmiBroker Dual Pane Layout */
        .pane-upper { flex: 7; position: relative; width: 100%; border-bottom: 2px solid #232736; }
        .pane-lower { flex: 3; position: relative; width: 100%; }
        
        /* Pane Controls Overlay */
        .pane-controls { position: absolute; top: 8px; left: 8px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; background: rgba(22, 26, 37, 0.85); padding: 4px 8px; border-radius: 4px; border: 1px solid #232736; }
        
        .status-badge { margin-left: auto; font-size: 0.75rem; padding: 3px 8px; border-radius: 3px; font-weight: 600; }
        .status-online { background: rgba(38, 166, 154, 0.2); color: #26a69a; }
        .status-error { background: rgba(239, 83, 80, 0.2); color: #ef5350; }
    </style>
</head>
<body>

    <header>
        <div class="logo">AmiBroker</div>
        <select id="symbolSelect"><option value="">Loading symbols...</option></select>
        <button id="loadBtn">Load Symbol</button>
        <div id="statusBadge" class="status-badge status-online">Initializing...</div>
    </header>

    <div class="tabs-bar" id="tabsBar">
        <button class="add-tab-btn" id="addTabBtn" title="New AmiBroker Tab">+</button>
    </div>

    <div id="workspace"></div>

    <script>
        const API_URL = window.location.origin;
        let availableSymbols = [];
        let tabCount = 0;
        let tabs = {};
        let activeTabId = null;

        // Load Stock Symbols on startup
        async function fetchSymbols() {
            try {
                const res = await fetch(`${API_URL}/api/symbols`);
                if (!res.ok) throw new Error("No backend connection");
                availableSymbols = await res.json();
                
                const select = document.getElementById('symbolSelect');
                select.innerHTML = '';
                availableSymbols.forEach(sym => {
                    const opt = document.createElement('option');
                    opt.value = sym;
                    opt.textContent = sym;
                    select.appendChild(opt);
                });
                
                document.getElementById('statusBadge').textContent = `${availableSymbols.length} Symbols`;
                document.getElementById('statusBadge').className = 'status-badge status-online';

                if (availableSymbols.length > 0) createNewTab(availableSymbols[0]);
            } catch (err) {
                document.getElementById('statusBadge').textContent = 'No DB Data';
                document.getElementById('statusBadge').className = 'status-badge status-error';
            }
        }

        // Indicator Logic
        function calculateSMA(data, period) {
            let res = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) continue;
                let sum = 0;
                for (let j = 0; j < period; j++) sum += data[i - j].close;
                res.push({ time: data[i].time, value: sum / period });
            }
            return res;
        }

        function calculateEMA(data, period) {
            let res = [];
            let k = 2 / (period + 1);
            let prevEMA = null;
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) continue;
                if (prevEMA === null) {
                    let sum = 0;
                    for (let j = 0; j < period; j++) sum += data[i - j].close;
                    prevEMA = sum / period;
                } else {
                    prevEMA = (data[i].close * k) + (prevEMA * (1 - k));
                }
                res.push({ time: data[i].time, value: prevEMA });
            }
            return res;
        }

        function calculateBollingerBands(data, period = 20, mult = 2) {
            let upper = [], lower = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) continue;
                let slice = data.slice(i - period + 1, i + 1);
                let mean = slice.reduce((a, b) => a + b.close, 0) / period;
                let variance = slice.reduce((a, b) => a + Math.pow(b.close - mean, 2), 0) / period;
                let stdDev = Math.sqrt(variance);
                upper.push({ time: data[i].time, value: mean + (stdDev * mult) });
                lower.push({ time: data[i].time, value: mean - (stdDev * mult) });
            }
            return { upper, lower };
        }

        function calculateRSI(data, period = 14) {
            let res = [];
            if (data.length <= period) return res;
            let gains = 0, losses = 0;

            for (let i = 1; i <= period; i++) {
                let diff = data[i].close - data[i - 1].close;
                if (diff >= 0) gains += diff; else losses += Math.abs(diff);
            }

            let avgGain = gains / period, avgLoss = losses / period;
            let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
            res.push({ time: data[period].time, value: 100 - (100 / (1 + rs)) });

            for (let i = period + 1; i < data.length; i++) {
                let diff = data[i].close - data[i - 1].close;
                let gain = diff >= 0 ? diff : 0, loss = diff < 0 ? Math.abs(diff) : 0;
                avgGain = (avgGain * (period - 1) + gain) / period;
                avgLoss = (avgLoss * (period - 1) + loss) / period;
                rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
                res.push({ time: data[i].time, value: 100 - (100 / (1 + rs)) });
            }
            return res;
        }

        // Create New Tab
        function createNewTab(symbol) {
            tabCount++;
            const tabId = `tab-${tabCount}`;
            const targetSymbol = symbol || (availableSymbols[0] || 'NSE');

            // 1. Tab Button
            const tabsBar = document.getElementById('tabsBar');
            const addBtn = document.getElementById('addTabBtn');
            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = `header-${tabId}`;
            tabEl.innerHTML = `
                <span class="tab-title">${targetSymbol}</span>
                <span class="close-tab" onclick="closeTab('${tabId}', event)">✕</span>
            `;
            tabEl.onclick = () => switchTab(tabId);
            tabsBar.insertBefore(tabEl, addBtn);

            // 2. Tab Workspace Layout
            const workspace = document.getElementById('workspace');
            const contentEl = document.createElement('div');
            contentEl.className = 'tab-content';
            contentEl.id = `content-${tabId}`;
            contentEl.innerHTML = `
                <div class="pane-upper" id="upper-${tabId}">
                    <div class="pane-controls">
                        <select onchange="changeChartStyle('${tabId}', this.value)">
                            <option value="candles">Candles</option>
                            <option value="line">Line</option>
                        </select>
                        <button class="btn-sma" onclick="toggleOverlay('${tabId}', 'sma')">SMA 20</button>
                        <button class="btn-ema" onclick="toggleOverlay('${tabId}', 'ema')">EMA 50</button>
                        <button class="btn-bb" onclick="toggleOverlay('${tabId}', 'bb')">BB 20,2</button>
                    </div>
                </div>
                <div class="pane-lower" id="lower-${tabId}">
                    <div class="pane-controls">
                        <button class="btn-vol btn-active" onclick="setLowerIndicator('${tabId}', 'volume')">Volume</button>
                        <button class="btn-rsi" onclick="setLowerIndicator('${tabId}', 'rsi')">RSI 14</button>
                    </div>
                </div>
            `;
            workspace.appendChild(contentEl);

            // 3. Initialize Independent Upper and Lower Panes
            const upperChart = LightweightCharts.createChart(document.getElementById(`upper-${tabId}`), {
                layout: { backgroundColor: '#0e1118', textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1c202e' }, horzLines: { color: '#1c202e' } },
                rightPriceScale: { borderColor: '#232736' },
                timeScale: { borderColor: '#232736', visible: false }
            });

            const lowerChart = LightweightCharts.createChart(document.getElementById(`lower-${tabId}`), {
                layout: { backgroundColor: '#0e1118', textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1c202e' }, horzLines: { color: '#1c202e' } },
                rightPriceScale: { borderColor: '#232736' },
                timeScale: { borderColor: '#232736', visible: true }
            });

            // Sync Paning & Zooming across both Panes
            upperChart.timeScale().subscribeVisibleTimeRangeChange(r => lowerChart.timeScale().setVisibleTimeRange(r));
            lowerChart.timeScale().subscribeVisibleTimeRangeChange(r => upperChart.timeScale().setVisibleTimeRange(r));

            const mainSeries = upperChart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350',
                borderUpColor: '#26a69a', borderDownColor: '#ef5350',
                wickUpColor: '#26a69a', wickDownColor: '#ef5350'
            });

            const volumeSeries = lowerChart.addHistogramSeries({
                priceFormat: { type: 'volume' },
                priceScaleId: ''
            });

            tabs[tabId] = {
                symbol: targetSymbol,
                chartStyle: 'candles',
                upperChart, lowerChart,
                mainSeries, volumeSeries,
                lineSeries: null, rsiSeries: null,
                data: [],
                overlays: { sma: null, ema: null, bbUpper: null, bbLower: null },
                lowerIndicator: 'volume'
            };

            switchTab(tabId);
            loadDataForTab(tabId, targetSymbol);
        }

        function switchTab(tabId) {
            activeTabId = tabId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            document.getElementById(`header-${tabId}`).classList.add('active');
            document.getElementById(`content-${tabId}`).classList.add('active');

            if (tabs[tabId] && tabs[tabId].symbol) {
                document.getElementById('symbolSelect').value = tabs[tabId].symbol;
            }

            window.dispatchEvent(new Event('resize'));
        }

        function closeTab(tabId, e) {
            e.stopPropagation();
            if (Object.keys(tabs).length <= 1) return;

            document.getElementById(`header-${tabId}`).remove();
            document.getElementById(`content-${tabId}`).remove();
            delete tabs[tabId];

            const remaining = Object.keys(tabs);
            switchTab(remaining[remaining.length - 1]);
        }

        async function loadDataForTab(tabId, symbol) {
            const tab = tabs[tabId];
            tab.symbol = symbol;
            document.querySelector(`#header-${tabId} .tab-title`).textContent = symbol;

            try {
                const res = await fetch(`${API_URL}/api/ohlcv/${symbol}`);
                if (!res.ok) throw new Error("Fetch failed");
                const raw = await res.json();

                tab.data = raw.sort((a, b) => (a.time > b.time ? 1 : -1));

                if (tab.chartStyle === 'candles') {
                    tab.mainSeries.setData(tab.data);
                } else if (tab.lineSeries) {
                    tab.lineSeries.setData(tab.data.map(d => ({ time: d.time, value: d.close })));
                }

                // Set Volume Data in Lower Pane
                tab.volumeSeries.setData(tab.data.map(d => ({
                    time: d.time,
                    value: d.volume,
                    color: d.close >= d.open ? 'rgba(38, 166, 154, 0.6)' : 'rgba(239, 83, 80, 0.6)'
                })));

                refreshOverlays(tabId);
                tab.upperChart.timeScale().fitContent();
            } catch (e) {
                console.error("Tab data error:", e);
            }
        }

        function changeChartStyle(tabId, style) {
            const tab = tabs[tabId];
            tab.chartStyle = style;
            if (style === 'line') {
                tab.upperChart.removeSeries(tab.mainSeries);
                tab.lineSeries = tab.upperChart.addLineSeries({ color: '#2962ff', lineWidth: 2 });
                tab.lineSeries.setData(tab.data.map(d => ({ time: d.time, value: d.close })));
            } else {
                if (tab.lineSeries) {
                    tab.upperChart.removeSeries(tab.lineSeries);
                    tab.lineSeries = null;
                }
                tab.mainSeries = tab.upperChart.addCandlestickSeries({
                    upColor: '#26a69a', downColor: '#ef5350',
                    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
                    wickUpColor: '#26a69a', wickDownColor: '#ef5350'
                });
                tab.mainSeries.setData(tab.data);
            }
            refreshOverlays(tabId);
        }

        function toggleOverlay(tabId, type) {
            const tab = tabs[tabId];
            const btn = document.querySelector(`#content-${tabId} .btn-${type}`);

            if (type === 'sma') {
                if (tab.overlays.sma) {
                    tab.upperChart.removeSeries(tab.overlays.sma);
                    tab.overlays.sma = null;
                    btn.classList.remove('btn-active');
                } else {
                    tab.overlays.sma = tab.upperChart.addLineSeries({ color: '#2962ff', lineWidth: 2 });
                    tab.overlays.sma.setData(calculateSMA(tab.data, 20));
                    btn.classList.add('btn-active');
                }
            } else if (type === 'ema') {
                if (tab.overlays.ema) {
                    tab.upperChart.removeSeries(tab.overlays.ema);
                    tab.overlays.ema = null;
                    btn.classList.remove('btn-active');
                } else {
                    tab.overlays.ema = tab.upperChart.addLineSeries({ color: '#ff6d00', lineWidth: 2 });
                    tab.overlays.ema.setData(calculateEMA(tab.data, 50));
                    btn.classList.add('btn-active');
                }
            } else if (type === 'bb') {
                if (tab.overlays.bbUpper) {
                    tab.upperChart.removeSeries(tab.overlays.bbUpper);
                    tab.upperChart.removeSeries(tab.overlays.bbLower);
                    tab.overlays.bbUpper = null;
                    tab.overlays.bbLower = null;
                    btn.classList.remove('btn-active');
                } else {
                    const bb = calculateBollingerBands(tab.data, 20, 2);
                    tab.overlays.bbUpper = tab.upperChart.addLineSeries({ color: '#ab47bc', lineWidth: 1 });
                    tab.overlays.bbLower = tab.upperChart.addLineSeries({ color: '#ab47bc', lineWidth: 1 });
                    tab.overlays.bbUpper.setData(bb.upper);
                    tab.overlays.bbLower.setData(bb.lower);
                    btn.classList.add('btn-active');
                }
            }
        }

        function setLowerIndicator(tabId, type) {
            const tab = tabs[tabId];
            const volBtn = document.querySelector(`#content-${tabId} .btn-vol`);
            const rsiBtn = document.querySelector(`#content-${tabId} .btn-rsi`);

            if (type === 'volume') {
                if (tab.rsiSeries) {
                    tab.lowerChart.removeSeries(tab.rsiSeries);
                    tab.rsiSeries = null;
                }
                tab.volumeSeries.applyOptions({ visible: true });
                volBtn.classList.add('btn-active');
                rsiBtn.classList.remove('btn-active');
            } else if (type === 'rsi') {
                tab.volumeSeries.applyOptions({ visible: false });
                if (!tab.rsiSeries) {
                    tab.rsiSeries = tab.lowerChart.addLineSeries({ color: '#e91e63', lineWidth: 2 });
                    tab.rsiSeries.setData(calculateRSI(tab.data, 14));
                }
                rsiBtn.classList.add('btn-active');
                volBtn.classList.remove('btn-active');
            }
        }

        function refreshOverlays(tabId) {
            const tab = tabs[tabId];
            if (tab.overlays.sma) tab.overlays.sma.setData(calculateSMA(tab.data, 20));
            if (tab.overlays.ema) tab.overlays.ema.setData(calculateEMA(tab.data, 50));
            if (tab.overlays.bbUpper) {
                const bb = calculateBollingerBands(tab.data, 20, 2);
                tab.overlays.bbUpper.setData(bb.upper);
                tab.overlays.bbLower.setData(bb.lower);
            }
            if (tab.rsiSeries) tab.rsiSeries.setData(calculateRSI(tab.data, 14));
        }

        document.getElementById('loadBtn').addEventListener('click', () => {
            const sym = document.getElementById('symbolSelect').value;
            if (sym && activeTabId) loadDataForTab(activeTabId, sym);
        });

        document.getElementById('addTabBtn').addEventListener('click', () => {
            const sym = document.getElementById('symbolSelect').value;
            createNewTab(sym);
        });

        window.addEventListener('resize', () => {
            Object.keys(tabs).forEach(tabId => {
                const tab = tabs[tabId];
                const upperEl = document.getElementById(`upper-${tabId}`);
                const lowerEl = document.getElementById(`lower-${tabId}`);
                if (upperEl && lowerEl) {
                    tab.upperChart.applyOptions({ width: upperEl.clientWidth, height: upperEl.clientHeight });
                    tab.lowerChart.applyOptions({ width: lowerEl.clientWidth, height: lowerEl.clientHeight });
                }
            });
        });

        fetchSymbols();
    </script>
</body>
</html>
