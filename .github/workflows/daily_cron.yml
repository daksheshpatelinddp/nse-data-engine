name: Daily NSE Fetcher

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Run Fetcher Script
      run: python fetch_data.py
      env:
        START_DATE: '2023-12-01'
        END_DATE: ''  # Leave blank for today's date, or specify e.g. '2026-09-25'

    - name: Commit and Push Updated Databases
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add nse_*.db
        git commit -m "Automated update: Yearly NSE Databases" || exit 0
        git pull --rebase origin main
        git push origin main