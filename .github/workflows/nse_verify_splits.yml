name: NSE - verify candidate splits on Yahoo (report only)
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python backend/verify_splits.py data/review/to_verify.csv data/review
      - uses: actions/upload-artifact@v4
        with:
          name: split-verification
          path: |
            data/review/verify_report.csv
            data/review/verified_apply.csv
